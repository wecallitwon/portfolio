<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>하이네켄 웹사이트 리디자인</title>
    <style>
        @keyframes view_on {
            0% { background: rgba(0,0,0,0.5); }
            50% { background: #00CC33; }
            100% { background: rgba(0,0,0,0.5); }
        }
        html { scroll-behavior: smooth; }
        body { margin: 0; padding: 0; overflow-x: hidden; background: #F0FFF4; min-width: 320px; }
        #wrap { width: 70%; margin: 0 auto; }
        img { display: block; width: 100%; }
        .btn { position: fixed; right: 15%; bottom: 0; transform: translateX(60px); }
        .btn a { text-decoration: none; color: #fff; display: block; width: 60px; padding: 20px 0; text-align: center; }
        .btn a.view { background: rgba(0,0,0,0.5); font-size: 14px; animation: view_on 3s infinite; }
        .btn a.gotop { background: rgba(0,0,0,1); }
        img { margin: 80px 0; }
    </style>
</head>

<body>
    <a name="top"></a>
    <div id="wrap">
        <div class="btn"><a href="https://wecallitwon.github.io/heineken/" target="_blank" class="view">Go to<br>Proto-<br>type</a><a href="#top" class="gotop">↑</a></div>
        <img src="../images/project/heineken-tit.jpg"></a>
        <img src="../images/project/heineken-main.jpg"></a>
        <img src="../images/project/heineken-sub.jpg"></a>
    </div>
</body>
</html>
