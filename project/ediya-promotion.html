<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>이디야 X 먼작귀 이벤트 프로모션 페이지 디자인</title>
    <style>
        @keyframes view_on {
            0% { background: rgba(0,0,0,0.5); }
            50% { background: #3D5389; }
            100% { background: rgba(0,0,0,0.5); }
        }
        html { scroll-behavior: smooth; }
        body { margin: 0; padding: 0; overflow-x: hidden; background: #EEFAFF; min-width: 320px; }
        #wrap { width: 100%; margin: 0; text-align: center; }
        img { display: block; width: 50%; margin: 0 auto; }
        .btn { position: fixed; right: 15%; bottom: 0; transform: translateX(60px); }
        .btn a { text-decoration: none; color: #fff; display: block; width: 60px; padding: 20px 0; text-align: center; }
        .btn a.view { background: rgba(0,0,0,0.5); font-size: 14px; animation: view_on 3s infinite; }
        .btn a.gotop { background: rgba(0,0,0,1); }
    </style>
</head>

<body>
    <a name="top"></a>
    <div id="wrap">
        <img src="../images/project/ediya-promotion.jpg" class="ediya-promotion" alt=""></a>
    </div>
</body>
</html>
